name: .NET Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ShadowHeist.sln

    - name: Build solution
      run: dotnet build ShadowHeist.sln --no-restore --configuration Release

    - name: Run xUnit tests
      run: dotnet test ShadowHeist.sln --no-build --configuration Release --verbosity normal
